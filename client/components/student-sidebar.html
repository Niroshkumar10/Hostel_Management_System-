<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 230px;
        background: #1e293b;
        color: white;
        padding-top: 20px;
        overflow-y: auto;
        z-index: 1000;
        box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar h4 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 600;
        color: white;
        padding: 0 10px;
    }

    .sidebar hr {
        margin: 10px 15px;
        border-color: #334155;
    }

    .sidebar a {
        display: block;
        color: #cbd5e1;
        padding: 12px 20px;
        text-decoration: none;
        transition: all 0.3s;
        border-left: 3px solid transparent;
        font-size: 14px;
    }

    .sidebar a:hover {
        background: #334155;
        color: white;
        border-left-color: #60a5fa;
    }

    .sidebar a.active {
        background: #2563eb;
        color: white;
        border-left-color: #fbbf24;
    }

    .sidebar a i {
        margin-right: 10px;
        width: 20px;
        display: inline-block;
    }

    .sidebar button {
        width: calc(100% - 20px);
        margin: 20px 10px 10px;
        background: #dc2626;
        border: none;
        padding: 10px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
        font-size: 14px;
    }

    .sidebar button:hover {
        background: #b91c1c;
    }

    .sidebar button i {
        margin-right: 8px;
    }

    /* Main content adjustment */
    .main-content {
        margin-left: 230px;
        min-height: 100vh;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .sidebar {
            width: 200px;
        }
        .main-content {
            margin-left: 200px;
        }
    }
</style>
</head>
<body>
    <div class="sidebar">
        <!-- Header with Student Name -->
        <div class="sidebar-header">
            <h4 id="sidebarStudentName">
                <i class="bi bi-person-circle"></i>
                <span>Loading...</span>
            </h4>
       
        </div>

        <!-- Navigation Links -->
        <div class="sidebar-nav">
            <a href="/client/pages/student/student-dashboard.html" class="nav-link" data-page="dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/client/pages/student/student-profile.html" class="nav-link" data-page="profile">
                <i class="bi bi-person-circle"></i>
                Profile
            </a>

            <a href="/client/pages/student/student-room.html" class="nav-link" data-page="room">
                <i class="bi bi-door-open"></i>
                Room
            </a>

            <a href="/client/pages/student/student-complaints.html" class="nav-link" data-page="complaints">
                <i class="bi bi-exclamation-triangle"></i>
                Complaints
            </a>

            <a href="/client/pages/student/student-attendance.html" class="nav-link" data-page="attendance">
                <i class="bi bi-calendar-check"></i>
                Attendance
            </a>

            <a href="/client/pages/student/student-leave.html" class="nav-link" data-page="leave">
                <i class="bi bi-calendar-plus"></i>
                Leave
            </a>

            <hr>
        </div>

        <!-- Footer with Logout Button -->
        <div class="sidebar-footer">
            <button onclick="logout()" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>
        </div>
    </div>

    <script>
        // Update student name in sidebar
        function updateSidebarStudentName() {
            const student = JSON.parse(localStorage.getItem("student"));
            const nameElement = document.getElementById("sidebarStudentName");
            if (nameElement) {
                const span = nameElement.querySelector('span');
                if (span) {
                    span.innerText = student?.name || "Student";
                }
            }
        }

        // Highlight active menu
        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop().replace('.html', '');
            const links = document.querySelectorAll('.nav-link');
            
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.includes(currentPage)) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem("studentLoggedIn");
                localStorage.removeItem("student");
                window.location.href = "/client/pages/admin/admin-login.html";
            }
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateSidebarStudentName();
            highlightActiveMenu();
        });
    </script>
</body>
</html>
