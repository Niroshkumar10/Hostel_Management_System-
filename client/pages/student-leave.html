<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Leave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

<div class="container">

  <h3 class="mb-4">Apply Leave</h3>

  <!-- FORM -->
  <div class="card p-4 shadow-sm">
    
    <div class="row">
      <div class="col-md-6">
        <label>From Date</label>
        <input type="date" id="from_date" class="form-control">
      </div>

      <div class="col-md-6">
        <label>To Date</label>
        <input type="date" id="to_date" class="form-control">
      </div>
    </div>

    <div class="mt-3">
      <label>Reason</label>
      <textarea id="reason" class="form-control" rows="3"></textarea>
    </div>

    <button class="btn btn-primary mt-3" onclick="applyLeave()">
      Apply Leave
    </button>

  </div>

  <!-- TABLE -->
  <h4 class="mt-5">My Leaves</h4>

  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>#</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="leaveTable"></tbody>
  </table>

</div>

<script src="../js/student-leave.js"></script>
</body>
</html>
