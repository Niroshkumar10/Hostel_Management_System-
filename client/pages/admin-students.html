<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#f1f5f9;
font-family:Segoe UI;
}

/* Sidebar */

.sidebar{
height:100vh;
background:#1e293b;
color:white;
padding-top:20px;
}

.sidebar h4{
font-weight:600;
}

.sidebar a{
display:block;
color:#cbd5e1;
padding:12px 18px;
text-decoration:none;
border-radius:6px;
margin:5px 10px;
transition:0.2s;
}

.sidebar a:hover{
background:#334155;
color:white;
}

/* Topbar */

.topbar{
background:white;
padding:12px 20px;
border-bottom:1px solid #e2e8f0;
}

/* Cards */

.card{
border:none;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

/* Table */

.table th{
font-size:14px;
}

.table td{
vertical-align:middle;
}

/* Buttons */

.btn-sm{
padding:5px 10px;
}

/* Flash Message */

#flashMessage{
z-index:9999;
min-width:250px;
}

</style>

<script>

if(localStorage.getItem("adminLoggedIn") !== "true"){
window.location.href="admin-login.html";
}

function logout(){
localStorage.removeItem("adminLoggedIn");
window.location.href="admin-login.html";
}

</script>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->
<div class="container-fluid">

<div class="row">

<div id="sidebar-container"></div>

<div class="col-md-10 p-4">

<h3>Dashboard</h3>

</div>

</div>

</div>

<!-- Main Content -->

<div class="col-md-10 p-0" style="margin-left: 250px;">

<!-- Topbar -->

<div class="topbar d-flex justify-content-between align-items-center">

<h5 class="m-0">Student Management</h5>

<input 
type="text"
id="searchStudent"
class="form-control w-25"
placeholder="🔍 Search student..."
onkeyup="searchStudent()"
>

</div>

<div class="p-4">

<div class="row g-4">

<!-- Add Student -->

<div class="col-lg-4">

<div class="card p-4">

<h5 class="mb-3">Add Student</h5>

<form id="studentForm">

<input type="text" id="name" class="form-control mb-2" placeholder="Full Name" required>

<input type="email" id="email" class="form-control mb-2" placeholder="Email Address" required>

<input type="text" id="phone" class="form-control mb-2" placeholder="Phone Number">

<input type="text" id="department" class="form-control mb-2" placeholder="Department">

<input type="number" id="year" class="form-control mb-2" placeholder="Year">

<select id="room_id" class="form-control mb-2"></select>

<input type="password" id="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-primary w-100">
<i class="bi bi-person-plus"></i> Add Student
</button>

</form>

</div>

</div>

<!-- Student Table -->

<div class="col-lg-8">

<div class="card p-4">

<h5 class="mb-3">Students List</h5>

<div class="table-responsive">

<table class="table table-hover">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Room Details</th> <!-- New Column -->
<th width="180">Actions</th>
</tr>

</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

<nav>
<ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- Flash Message -->

<div id="flashMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow">
<span id="flashText"></span>
</div>

<!-- View Student Modal -->

<div class="modal fade" id="viewModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Student Profile</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<p><b>ID:</b> <span id="viewId"></span></p>
<p><b>Name:</b> <span id="viewName"></span></p>
<p><b>Email:</b> <span id="viewEmail"></span></p>
<p><b>Phone:</b> <span id="viewPhone"></span></p>
<p><b>Department:</b> <span id="viewDept"></span></p>
<p><b>Room:</b> <span id="viewRoom"></span></p>

</div>

</div>

</div>

</div>

<!-- Delete Modal -->

<div class="modal fade" id="deleteModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Delete Student</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
Are you sure you want to delete this student?
</div>

<div class="modal-footer">

<button class="btn btn-secondary" data-bs-dismiss="modal">
Cancel
</button>

<button class="btn btn-danger" onclick="confirmDelete()">
Delete
</button>

</div>

</div>

</div>

</div>
<script src="../js/sidebar.js"></script>
<script src="../js/admin-students.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
